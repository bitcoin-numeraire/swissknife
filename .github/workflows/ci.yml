name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Validate changelog
        uses: mindsers/changelog-reader-action@v2.4.0
        with:
          path: ./CHANGELOG.md
          version: Unreleased
          validation_level: error
          validation_depth: 100

  fmt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2.9.2

      - name: Check formatting
        run: make fmt

  clippy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2.9.2

      - name: Run clippy
        run: make lint

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2.9.2

      - name: Build
        run: make build

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2.9.2

      - name: Run tests
        run: make test

      - name: Run listener adapter component tests
        run: make test-adapters

  docker-planner:
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build Rust planner
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: planner
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=rust-planner-${{ matrix.platform }}
          cache-to: type=gha,scope=rust-planner-${{ matrix.platform }},mode=max

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ESLint
        run: yarn lint

      - name: Run Prettier
        run: yarn fm:check

      - name: Run TypeScript
        run: yarn typecheck

      - name: Run dashboard tests
        run: yarn test

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run dashboard E2E tests
        run: yarn test:e2e

      - name: Run build
        run: yarn build

  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.87.24
        with:
          tool: cargo-audit

      - name: Run cargo audit
        # rust_decimal's optional rkyv feature is not enabled, but Cargo.lock
        # records optional dependencies and cargo-audit scans them unconditionally.
        run: cargo audit --ignore RUSTSEC-2026-0235
