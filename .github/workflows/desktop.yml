name: Desktop packages

on:
  pull_request:
    paths:
      - desktop/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Desktop ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-latest
            installer: dmg
            bundles: dmg
            flags: --target universal-apple-darwin
          - platform: Windows
            runner: windows-latest
            installer: nsis
            bundles: nsis
            flags: ''
          - platform: Linux
            runner: ubuntu-24.04
            installer: deb
            bundles: deb,appimage
            flags: ''
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy,rustfmt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install both macOS targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: desktop
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Package a predecessor for the upgrade test
        shell: bash
        run: |
          npm exec --yes --package=@tauri-apps/cli@2.12.6 -- tauri build ${{ matrix.flags }} --config tests/predecessor.json --bundles ${{ matrix.installer }} -- --locked
          mkdir "$RUNNER_TEMP/predecessor"
          find target -type f -path '*/bundle/${{ matrix.installer }}/*0.0.1*' -exec mv '{}' "$RUNNER_TEMP/predecessor/" \;
        env:
          NO_STRIP: 'true'
      - name: Package application
        run: npm exec --yes --package=@tauri-apps/cli@2.12.6 -- tauri build ${{ matrix.flags }} --bundles ${{ matrix.bundles }} -- --locked
        env:
          NO_STRIP: 'true'
      - name: Install, reopen, upgrade and remove the Linux wallet
        if: runner.os == 'Linux'
        run: |
          packages=("$RUNNER_TEMP"/predecessor/*.deb target/release/bundle/deb/*.deb)
          executable=/usr/bin/swissknife-desktop
          test ! -e "$executable"
          for package in "${packages[@]}"; do
            name=$(dpkg-deb -f "$package" Package)
            version=$(dpkg-deb -f "$package" Version)
            sudo dpkg --install "$package"
            test "$(dpkg-query -W -f='${Version}' "$name")" = "$version"
            mode=()
            if [[ "$package" == "$RUNNER_TEMP"/predecessor/* ]]; then mode=(--initialize); fi
            xvfb-run -a python3 tests/launch.py "$executable" "${mode[@]}"
          done
          xvfb-run -a python3 tests/launch.py "$executable"
          sudo dpkg --remove "$name"
          test ! -e "$executable"
          image=(target/release/bundle/appimage/*.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a python3 tests/launch.py "${image[0]}"
          cd target/release/bundle
          sha256sum deb/*.deb appimage/*.AppImage > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Install, reopen, upgrade and remove the macOS wallet
        if: runner.os == 'macOS'
        run: |
          images=("$RUNNER_TEMP"/predecessor/*.dmg target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          mount="$RUNNER_TEMP/swissknife-dmg"
          app="$RUNNER_TEMP/Applications/SwissKnife.app"
          mkdir -p "$(dirname "$app")"
          test ! -e "$app"
          for image in "${images[@]}"; do
            hdiutil verify "$image"
            hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$image"
            trap 'hdiutil detach "$mount"' EXIT
            rm -rf "$app"
            ditto "$mount/SwissKnife.app" "$app"
            hdiutil detach "$mount"
            trap - EXIT
            version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
            [[ "$(basename "$image")" == *"_${version}_"* ]]
            executable="$app/Contents/MacOS/swissknife-desktop"
            architectures=$(lipo -archs "$executable")
            grep -qw x86_64 <<< "$architectures"
            grep -qw arm64 <<< "$architectures"
            if [[ "$image" == "$RUNNER_TEMP"/predecessor/* ]]; then
              python3 tests/launch.py "$executable" --initialize
            else
              python3 tests/launch.py "$executable"
            fi
          done
          python3 tests/launch.py "$executable"
          rm -r "$app"
          test ! -e "$app"
      - name: Install, reopen, upgrade and remove the Windows wallet
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP SwissKnifeDesktop
          $executable = Join-Path $installDir swissknife-desktop.exe
          if (Test-Path $installDir) { throw "Expected a clean installation directory" }
          $installers = @(
            Get-Item "$env:RUNNER_TEMP/predecessor/*.exe" -ErrorAction Stop
            Get-Item "target/release/bundle/nsis/*.exe" -ErrorAction Stop
          )
          foreach ($installer in $installers) {
            $result = Start-Process $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
            if ($result.ExitCode -ne 0) { throw "NSIS exited with $($result.ExitCode)" }
            $version = (Get-Item $executable).VersionInfo.ProductVersion
            if (!$version -or !$installer.Name.Contains("_${version}_")) { throw "Unexpected installed version ($version)" }
            $mode = if ($installer.Directory.Name -eq "predecessor") { @("--initialize") } else { @() }
            python tests/launch.py $executable @mode
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python tests/launch.py $executable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Start-Process (Join-Path $installDir uninstall.exe) -ArgumentList "/S" -Wait -PassThru
          if ($result.ExitCode -ne 0 -or (Test-Path $executable)) { throw "Uninstall failed" }
      - name: Upload installable packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: SwissKnife-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            desktop/target/**/bundle/dmg/*.dmg
            desktop/target/**/bundle/nsis/*.exe
            desktop/target/**/bundle/deb/*.deb
            desktop/target/**/bundle/appimage/*.AppImage
            desktop/target/**/bundle/SHA256SUMS
