name: Integration Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      wavelength_public_network:
        description: "Opt-in Wavelength public-network smoke test (unfunded)"
        type: choice
        required: true
        default: none
        options: [none, signet, testnet]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Existing LND/CLN adapters run the full suite on SQLite, with an
  # additional Postgres cell. LDK adds its Lightning-only provider contract;
  # unsupported on-chain behavior is checked explicitly in that target.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        provider: [lnd_grpc, lnd_rest, cln_grpc, cln_rest]
        database: [sqlite]
        include:
          - provider: lnd_grpc
            database: postgres
          # LDK is initially Lightning-only. This target shares auth/account/
          # invoice/LNURL suites and explicitly tests unavailable on-chain RPCs.
          - provider: ldk_server
            database: sqlite

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2.9.3

      - name: Integration tests (${{ matrix.database }} / ${{ matrix.provider }})
        run: |
          make test-integration \
            ITEST_DATABASE=${{ matrix.database }} \
            ITEST_PROVIDER=${{ matrix.provider }} \
            ITEST_PROJECT=swissknife-itest-${{ matrix.database }}-${{ matrix.provider }}

      - name: Collect dependency logs
        if: failure()
        run: |
          make itest-logs \
            ITEST_PROJECT=swissknife-itest-${{ matrix.database }}-${{ matrix.provider }} || true

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: itest-${{ matrix.database }}-${{ matrix.provider }}
          path: target/itest
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop dependencies
        if: always()
        run: |
          make itest-down \
            ITEST_PROJECT=swissknife-itest-${{ matrix.database }}-${{ matrix.provider }} || true

  # DB-backed Unit-of-Work tests: reservation/settlement balance
  # invariants and concurrency on both SQLite and Postgres.
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2.9.3

      - name: Persistence (UoW) tests (${{ matrix.database }})
        run: |
          make test-persistence \
            ITEST_DATABASE=${{ matrix.database }} \
            ITEST_PROJECT=swissknife-persistence-${{ matrix.database }}

      - name: Stop dependencies
        if: always()
        run: |
          make itest-down ITEST_PROJECT=swissknife-persistence-${{ matrix.database }} || true

  # This is a daemon transport contract, not a funded Ark payment gate. The
  # full Wavelength topology/default cutover remains tracked in #389/#390.
  provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        provider: [wavelength]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: swatinem/rust-cache@v2.9.3
      - name: Client transport tests
        run: cargo test -p wavelength-client --test transport
      - name: Real daemon RPC contract (${{ matrix.provider }})
        run: tests/itest/scripts/test-wavelength-client.sh

  # Shared public services are not deterministic PR infrastructure. Run this
  # explicitly to check external interoperability without private components.
  wavelength-public:
    if: github.event_name == 'workflow_dispatch' && inputs.wavelength_public_network != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: swatinem/rust-cache@v2.9.3
      - name: Public Wavelength wallet (${{ inputs.wavelength_public_network }})
        env:
          WAVELENGTH_PUBLIC_NETWORK: ${{ inputs.wavelength_public_network }}
        run: tests/itest/scripts/test-wavelength-public.sh

  # Full-matrix merged coverage: unit + UoW (both DBs) + the integration suite
  # across every provider x DB cell, merged into one report (printed to the job
  # log and uploaded as lcov). This is the true total coverage.
  #
  # It re-runs the whole suite under instrumentation, which duplicates the
  # integration + persistence jobs above. Those are the PR gates and already
  # cover every cell, so coverage runs only on pushes to main (and manual
  # dispatch), not on every pull-request push.
  coverage:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.87.30
        with:
          tool: cargo-llvm-cov

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2.9.3

      - name: Full-matrix merged coverage
        run: make coverage-matrix

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 14
