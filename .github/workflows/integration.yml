name: Integration Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2.9.3

      - name: Run tests
        uses: ./.github/actions/test-with-coverage
        with:
          target: test
          artifact: unit

  # Run all four Lightning adapters on SQLite. On PostgreSQL, cover LND gRPC
  # and the production CLN REST configuration.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        provider: [lnd_grpc, lnd_rest, cln_grpc, cln_rest]
        database: [sqlite]
        include:
          - provider: lnd_grpc
            database: postgres
          - provider: cln_rest
            database: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2.9.3

      - name: Integration tests (${{ matrix.database }} / ${{ matrix.provider }})
        uses: ./.github/actions/test-with-coverage
        with:
          target: test-integration
          artifact: integration-${{ matrix.database }}-${{ matrix.provider }}
        env:
          ITEST_DATABASE: ${{ matrix.database }}
          ITEST_PROVIDER: ${{ matrix.provider }}
          ITEST_PROJECT: swissknife-itest-${{ matrix.database }}-${{ matrix.provider }}

      - name: Collect dependency logs
        if: failure()
        run: |
          make itest-logs \
            ITEST_PROJECT=swissknife-itest-${{ matrix.database }}-${{ matrix.provider }} || true

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: itest-${{ matrix.database }}-${{ matrix.provider }}
          path: target/itest
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop dependencies
        if: always()
        run: |
          make itest-down \
            ITEST_PROJECT=swissknife-itest-${{ matrix.database }}-${{ matrix.provider }} || true

  # DB-backed Unit-of-Work tests: reservation/settlement balance
  # invariants and concurrency on both SQLite and Postgres.
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2.9.3

      - name: Persistence (UoW) tests (${{ matrix.database }})
        uses: ./.github/actions/test-with-coverage
        with:
          target: test-persistence
          artifact: persistence-${{ matrix.database }}
        env:
          ITEST_DATABASE: ${{ matrix.database }}
          ITEST_PROJECT: swissknife-persistence-${{ matrix.database }}

      - name: Stop dependencies
        if: always()
        run: |
          make itest-down ITEST_PROJECT=swissknife-persistence-${{ matrix.database }} || true

  coverage:
    if: github.event_name != 'pull_request'
    needs: [test, integration, persistence]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download tracefiles from this run
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: coverage-cell-*
          path: coverage-cells

      - name: Merge test coverage
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          args=()
          for fragment in coverage-cells/*/coverage.info; do
            test -s "$fragment"
            args+=(--add-tracefile "$fragment")
          done
          lcov "${args[@]}" --branch-coverage --output-file lcov.info
          lcov --summary lcov.info --branch-coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 14
