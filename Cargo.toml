[workspace]
members = ["crates/migration", "crates/swissknife-types"]
resolver = "2"

[package]
name = "swissknife"
version = "0.2.0"
edition = "2021"
authors = ["Dario Anongba Varela <dario.varela@numeraire.tech>"]
rust-version = "1.96"
license = "MIT"
description = "Numeraire SwissKnife enables easy integration of Bitcoin, Lightning and smart contract protocols."
repository = "https://github.com/bitcoin-numeraire/swissknife"
homepage = "https://numeraire.tech"
build = "build.rs"

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["typed-header", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_bolt = "0.5.2"
serde_with = "3.22.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time", "fs", "io-util"] }
bip21 = { version = "0.5.0", features = ["std"] }
lnurl = { package = "lnurl-rs", version = "0.10.0", default-features = false, features = ["async"] }
config = { version = "0.15.25", features = ["yaml", "json", "toml"] }
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
reqwest = { version = "0.12.28", features = ["json"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = "0.4.45"
thiserror = "2.0.20"
tower-http = { version = "0.7.0", features = [
    "fs",
    "timeout",
    "trace",
    "cors",
] }
regex = "1"
sea-orm = { version = "2.0.2", features = [
    "sqlx-postgres",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-json",
    "with-uuid",
] }
strum = "0.28"
strum_macros = "0.28"
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-prost = "0.14.6"
prost = "0.14.4"
lightning-invoice = "0.34.1"
hex = "0.4.3"
anyhow = "1.0.104"
futures-util = "0.3.34"
humantime = "2.4.0"
rust_socketio = { version = "0.6.0", features = ["async"] }
migration = { path = "crates/migration" }
swissknife-types = { path = "crates/swissknife-types" }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
native-tls = "0.2.18"
nostr-sdk = "0.45.1"
rand = "0.10.2"
base64 = "0.23.1"
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
http = "1.5.0"
bytes = "1.12.1"
bitcoin = "=0.32.102"
argon2 = "0.5.3"

[build-dependencies]
tonic-prost-build = "0.14.6"
chrono = "0.4.45"

[profile.release]
lto = true
codegen-units = 1
strip = true

[features]
# Enables the integration suite (tests/api.rs). Off by default so a
# plain `cargo test` runs only unit tests; the itest harness needs the regtest
# docker stack (see tests/itest/). Run with `make test-integration`.
itest = []

[dev-dependencies]
mockall = "0.15.0"
dtor = "1.0"
wiremock = "0.6"
