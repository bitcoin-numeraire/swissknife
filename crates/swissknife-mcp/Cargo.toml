[package]
name = "swissknife-mcp"
version = "0.3.5"
edition = "2021"
rust-version.workspace = true
license = "MIT"
publish = false
description = "Wallet-scoped SwissKnife Model Context Protocol server"

[dependencies]
anyhow = "1"
lightning-invoice = { version = "0.34.2", features = ["std"] }
reqwest = { version = "0.13.5", features = ["json"] }
rmcp = { version = "3.11", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
