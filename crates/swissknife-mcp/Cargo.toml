[package]
name = "swissknife-mcp"
version = "0.3.5"
edition = "2021"
rust-version.workspace = true
license = "MIT"
publish = false
description = "Wallet-scoped SwissKnife Model Context Protocol server"

[dependencies]
anyhow = "1"
axum = "0.8.9"
hex = "0.4.3"
subtle = "2.6"
tokio = { version = "1", features = ["net", "signal"] }
bitcoin = "=0.32.102"
l402-proto = { git = "https://github.com/lightninglabs/L402sdk", rev = "300e136e27237ce1720494e8627e3b21fd895243" }
lnurl = { package = "lnurl-rs", version = "0.11.0", default-features = false }
libmacaroon = { version = "0.4.0", default-features = false }
lightning-invoice = { version = "0.34.2", features = ["std"] }
reqwest = { version = "0.13.5", features = ["json"] }
rmcp = { version = "3.11", features = ["transport-io", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
