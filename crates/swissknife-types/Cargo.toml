[package]
name = "swissknife-types"
version = "0.3.4"
edition = "2021"
authors = ["Dario Anongba Varela <dario.varela@numeraire.tech>"]
rust-version.workspace = true
license = "MIT"
description = "Shared API/contract types (entities, enums, requests, responses) for Numeraire SwissKnife."
repository = "https://github.com/bitcoin-numeraire/swissknife"
readme = "README.md"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.25.0"
strum = "0.28"
strum_macros = "0.28"
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
nostr = "0.45"
