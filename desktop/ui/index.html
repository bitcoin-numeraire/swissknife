<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SwissKnife</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="launcher.js"></script>
</head>
<body>
  <main>
    <header>
      <img src="logo.svg" alt="SwissKnife" width="54" height="54">
      <div>
        <label for="language" data-i18n>Language</label>
        <select id="language">
          <option value="" data-i18n>System language</option>
          <option value="de" lang="de">Deutsch</option>
          <option value="en" lang="en">English</option>
          <option value="es" lang="es">Español</option>
          <option value="fr" lang="fr">Français</option>
          <option value="it" lang="it">Italiano</option>
          <option value="pt" lang="pt-PT">Português</option>
        </select>
      </div>
    </header>
    <h1 data-i18n>Connect to SwissKnife</h1>
    <form id="connect">
      <label for="instance" data-i18n>Dashboard URL</label>
      <input id="instance" type="url" required spellcheck="false" value="https://app.numeraire.tech">
      <details id="advanced">
        <summary data-i18n>Single sign-on</summary>
        <label for="login" data-i18n>Identity provider URL</label>
        <input id="login" type="url" spellcheck="false" placeholder="https://login.example.com">
        <p data-i18n>Enter your provider’s origin if your instance uses single sign-on.</p>
      </details>
      <button type="submit" data-i18n>Open wallet</button>
      <p role="alert" id="error"></p>
    </form>
  </main>
</body>
</html>
