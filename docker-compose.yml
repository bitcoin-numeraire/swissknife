services:
  postgres:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-numeraire}
      # Enable logging
      POSTGRES_LOGGING: "on"
      # Environment variables to control PostgreSQL logging behavior
      POSTGRES_LOG_MIN_DURATION_STATEMENT: "0" # Log all statements immediately
      POSTGRES_LOG_STATEMENTS: "all"
    ports:
      - 5432:5432
    volumes:
      - db:/var/lib/postgresql
    command:
      - "postgres"
      - "-c"
      - "logging_collector=off" # Ensure logging collector is turned off to use stderr
      - "-c"
      - "log_statement=all" # Log all statements
      - "-c"
      - "log_destination=stderr" # Send logs to stderr

  pgadmin:
    image: dpage/pgadmin4:9.18@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_SERVER_JSON_FILE: /servers.json
    ports:
      - 5050:80
    volumes:
      - pgadmin:/root/.pgadmin
      - ./deps/pgadmin/servers.json:/servers.json
    depends_on:
      - postgres

  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.2@sha256:94d4ebf0fe793a727b3468b846e92ccbcd513f3b359a095802d817934d762e01
    environment:
      JSON_CONFIG_PATH: /tmp/mock-oauth2-config.json
    ports:
      - "${MOCK_OAUTH2_PORT:-8090}:8080"
    volumes:
      - ./deps/mock-oauth2/config.json:/tmp/mock-oauth2-config.json:ro

  swissknife:
    image: swissknife:latest
    environment:
      SWISSKNIFE_DATABASE__URL: ${SWISSKNIFE_DATABASE__URL:-postgres://postgres:postgres@postgres/numeraire}
      SWISSKNIFE_CLN_REST_CONFIG__RUNE: ${SWISSKNIFE_CLN_REST_CONFIG__RUNE:-}
      SWISSKNIFE_JWT__SECRET: ${SWISSKNIFE_JWT__SECRET:-}
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    volumes:
      - ./config/production.toml:/config/production.toml
      - ./certs:/certs

  swissknife-server:
    image: swissknife-server:latest
    environment:
      SWISSKNIFE_DATABASE__URL: ${SWISSKNIFE_DATABASE__URL:-postgres://postgres:postgres@postgres/numeraire}
      SWISSKNIFE_CLN_REST_CONFIG__RUNE: ${SWISSKNIFE_CLN_REST_CONFIG__RUNE:-}
      SWISSKNIFE_JWT__SECRET: ${SWISSKNIFE_JWT__SECRET:-}
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    volumes:
      - ./config/production.toml:/config/production.toml
      - ./certs:/certs

volumes:
  db:
  pgadmin:
